# ── HTTP → HTTPS ──────────────────────────────────────────────────────────────
# www over HTTP goes straight to the canonical https non-www (single hop).
server {
    listen 80;
    server_name www.rajhanstea.com;
    return 301 https://rajhanstea.com$request_uri;
}
server {
    # default_server: this catch-all must win for any host that isn't www
    # (including the bare apex rajhanstea.com), otherwise nginx falls back to the
    # first server block for this port — the www redirect — and 301s every apex
    # request to itself.
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS www → non-www (canonical host) ─────────────────────────────────────
server {
    listen 443 ssl;
    server_name www.rajhanstea.com;

    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/key.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://rajhanstea.com$request_uri;
}

# ── Main HTTPS server (canonical non-www) ────────────────────────────────────
server {
    # default_server is critical: neither server_name here ("_") nor the www
    # block matches the bare apex "rajhanstea.com", so without this the first
    # 443 block (the www→non-www redirect) becomes the default and 301s every
    # apex request back to itself — an infinite self-redirect on every URL.
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/key.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # SEO: backend-generated sitemap/robots at the root (exact match beats `/`).
    location = /sitemap.xml {
        proxy_pass http://tea-backend:3000/api/v1/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location = /robots.txt {
        proxy_pass http://tea-backend:3000/api/v1/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SEO: collapse duplicate policy URLs onto their canonical slug (301).
    # Canonical slugs: return-refund-policy and terms-and-conditions. The
    # terms-and-conditions/ URL is the preferred survivor and must NOT redirect
    # (it falls through to the app below and serves 200); both terms-conditions
    # variants 301 to it. No exact-match location exists for the canonical slugs,
    # so they reach `location /` and render normally — no loop, no chain.
    location = /page/return-refund         { return 301 https://rajhanstea.com/page/return-refund-policy/; }
    location = /page/return-refund/        { return 301 https://rajhanstea.com/page/return-refund-policy/; }
    location = /page/terms-conditions      { return 301 https://rajhanstea.com/page/terms-and-conditions/; }
    location = /page/terms-conditions/     { return 301 https://rajhanstea.com/page/terms-and-conditions/; }

    location / {
        proxy_pass http://tea-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # tea-frontend serves prerendered pages as directories, so it 301s to add
        # a trailing slash — but over the internal HTTP hop it builds an http://
        # Location, downgrading the client's HTTPS. Rewrite it back to https.
        proxy_redirect http://$host/ https://$host/;
    }

    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /api/ {
        client_max_body_size 30M;
        proxy_pass http://tea-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
