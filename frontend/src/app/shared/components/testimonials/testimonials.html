<section class="reviews-carousel-section">
  <div class="reviews-container">
    <div class="reviews-header">
      <h2 class="reviews-title">What Our Customers Say</h2>
    </div>

    <div class="carousel-wrapper">
      <!-- Left circular arrow -->
      <button class="carousel-arrow arrow-left" (click)="scrollLeft()" aria-label="Previous reviews">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- Horizontal scroll container -->
      <div class="carousel-scroll" #scrollRow>
        @for (review of reviews; track $index) {
          <article class="review-card">
            <!-- Top Section: Name/Verified & Date -->
            <div class="card-header">
              <div class="header-left">
                <span class="customer-name">{{ review.customerName }}</span>
                @if (review.isVerifiedBuyer) {
                  <span class="verified-badge">
                    <span class="verified-dot"></span>
                    Verified Buyer
                  </span>
                }
              </div>
              <span class="review-date">{{ review.date }}</span>
            </div>

            <!-- Stars Section -->
            <div class="card-rating">
              @for (star of [1,2,3,4,5]; track star) {
                <svg 
                  class="star-icon" 
                  [class.filled]="star <= review.rating"
                  width="16" 
                  height="16" 
                  viewBox="0 0 24 24"
                >
                  <path d="M12 .587l3.668 7.431 8.2 1.191-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.857 1.4-8.168L.132 9.309l8.2-1.191L12 .587z"/>
                </svg>
              }
            </div>

            <!-- Review Content -->
            <div class="card-content">
              <h3 class="review-title">{{ review.reviewTitle }}</h3>
              <p class="review-text">{{ review.reviewText }}</p>
            </div>

            <!-- Bottom Section: Product Info -->
            <div class="card-product">
              <img [src]="review.productImage" [alt]="review.productName" class="product-thumbnail" />
              <span class="product-name">{{ review.productName }}</span>
            </div>
          </article>
        }
      </div>

      <!-- Right circular arrow -->
      <button class="carousel-arrow arrow-right" (click)="scrollRight()" aria-label="Next reviews">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>
</section>
