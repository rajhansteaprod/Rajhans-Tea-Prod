<div class="stats-carousel">
  <div class="stats-carousel__track">
    @for (stat of displayStats(); track $index) {
      <div class="stats-carousel__item">
        <span class="stats-carousel__text">{{ stat.text }}</span>
        @if ($index < displayStats().length - 1) {
          <span class="stats-carousel__divider">✦</span>
        }
      </div>
    }
  </div>
</div>
