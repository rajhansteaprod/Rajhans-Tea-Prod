<section class="faq-section">
  <div class="container">
    <div class="header">
      <p class="label">Questions?</p>
      <h2 class="title">Frequently Asked Questions</h2>
    </div>

    <div class="faq-list">
      @for (faq of faqs; track faq.id) {
        <div class="faq-item">
          <button class="faq-button" (click)="toggle(faq)">
            <span class="question">{{ faq.question }}</span>
            <svg class="chevron" [class.open]="faq.isOpen" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </button>
          @if (faq.isOpen) {
            <div class="answer">{{ faq.answer }}</div>
          }
        </div>
      }
    </div>
  </div>
</section>
