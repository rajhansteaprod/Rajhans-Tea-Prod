@for (section of sections(); track section.title; let secIdx = $index) {
  <section class="featured" [style.paddingTop]="secIdx > 0 ? '0' : '64px'" [style.paddingBottom]="'64px'" [style.marginTop]="'0'">
    <div class="featured__container">
      <!-- Header -->
      <div class="featured__header">
        <div class="featured__header-left">
          <p class="featured__label">OUR TEAS</p>
          <h2 class="featured__title">{{ section.title }}</h2>
        </div>
        <a class="featured__view-all" href="/products">View All →</a>
      </div>

      <!-- Product Grid -->
      <div class="featured__grid">
        <div class="mobile-product-scroll">
          @for (product of section.products; track product._id; let i = $index) {
            <div class="scroll-card-wrap">
              <app-product-card
                [appScrollReveal]="i"
                [product]="product"
                [isHovering]="isHovering(product._id)"
                [isWishlisted]="isWishlisted(product._id)"
                [getRating]="getRating"
                [getReviewCount]="getReviewCount"
                (imageHover)="setHovering(product._id, $event)"
                (toggleWishlistClick)="toggleWishlist(product, $event)"
                (addToCartClick)="addToCart(product, $event)"
                (buyNowClick)="buyNow(product, $event)"
                (cardClick)="goToProduct(product)"
              />
            </div>
          }
        </div>
      </div>
    </div>
  </section>
}
