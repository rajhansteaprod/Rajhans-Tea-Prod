<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">Sign In</h1>
    <p class="login-subtitle">Complete verification in the popup to continue</p>

    <!-- Loading state -->
    <p class="success-message" *ngIf="isLoading">Signing you in...</p>

    <!-- Error Message -->
    <div class="error-banner" *ngIf="error">
      <p>{{ error }}</p>
      <button class="btn-close" (click)="clearError()">×</button>
    </div>

    <!-- Reopen the MSG91 popup (e.g. if the user closed it) -->
    <button class="btn-primary" (click)="openLogin()" [disabled]="isLoading">
      Sign in with OTP
    </button>

    <!-- Terms -->
    <p class="terms-text">
      By continuing, you agree to our
      <a href="/terms" target="_blank">Terms of Service</a> and
      <a href="/privacy" target="_blank">Privacy Policy</a>
    </p>
  </div>
</div>
