<div class="dashboard">
  <!-- Header: Personalized Greeting & Quick Actions -->
  <header class="dashboard__header">
    <div class="dashboard__header-content">
      <div class="dashboard__greeting">
        <h1 class="dashboard__title">Welcome back, {{ userName() }}</h1>
        <p class="dashboard__subtitle">{{ userEmail() }}</p>
      </div>
      @if (isAdmin()) {
        <a routerLink="/admin" class="dashboard__admin-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m8.88 0l4.24-4.24M19.78 19.78l-4.24-4.24M9.98 9.98l-4.24 4.24"/>
          </svg>
          Admin
        </a>
      }
    </div>
  </header>

  <div class="dashboard__container">
    <!-- Sidebar Navigation -->
    <aside class="dashboard__sidebar">
      <nav class="dashboard__nav">
        @for (item of sidebarItems(); track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            class="dashboard__nav-link"
          >
            <span class="dashboard__nav-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" [innerHTML]="trustSvg(item.icon)"></svg>
            </span>
            <span class="dashboard__nav-label">{{ item.label }}</span>
            <span class="dashboard__nav-indicator"></span>
          </a>
        }

        <a routerLink="/contact" class="dashboard__nav-link">
          <span class="dashboard__nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </span>
          <span class="dashboard__nav-label">Support</span>
          <span class="dashboard__nav-indicator"></span>
        </a>
      </nav>

      <!-- Logout Button -->
      <button class="dashboard__logout" (click)="signOut()" aria-label="Log out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
        <span>Log out</span>
      </button>
    </aside>

    <!-- Main Content -->
    <main class="dashboard__content">
      <router-outlet />
    </main>
  </div>
</div>
