<div class="saved-addresses">
  @if (savedAddresses().length > 0) {
    <div class="saved-addresses__list">
      @for (address of savedAddresses(); track address._id) {
        <div class="saved-addresses__card" [class.selected]="selectedId() === address._id" (click)="selectCurrentAddress(address)">
          <input
            type="radio"
            class="saved-addresses__radio"
            [checked]="selectedId() === address._id"
            (change)="selectCurrentAddress(address)"
          />
          <div class="saved-addresses__card-content">
            <div class="saved-addresses__label-row">
              <span class="saved-addresses__label">{{ address.label }}</span>
              @if (address.isDefault) {
                <span class="saved-addresses__default-badge">DEFAULT</span>
              }
            </div>
            <p class="saved-addresses__address-full">
              {{ address.address }} • {{ address.city }}, near {{ address.landmark }}, {{ address.state }} - {{ address.pinCode }}
            </p>
          </div>
        </div>
      }
    </div>
  }
</div>
