<div class="static-page">
  @if (page()) {
    <div class="static-page__container">
      <!-- Header -->
      <div class="static-page__header">
        <h1 class="static-page__title">{{ page().title }}</h1>
        <p class="static-page__date">Last Updated: {{ page().updatedAt | date: 'MMMM d, y' }}</p>
      </div>

      <!-- Content -->
      <div class="static-page__content" [innerHTML]="page().content"></div>
    </div>
  }

  @if (notFound()) {
    <div class="static-page__container">
      <div class="static-page__error">
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist.</p>
        <a href="/" class="static-page__link">Go back to home</a>
      </div>
    </div>
  }
</div>
